LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      example: admin@example.com
    password:
      type: string
      format: password
      example: admin_secret

Token:
  type: object
  required: [access_token, token_type, expires_in]
  properties:
    access_token:
      type: string
      description: Подписанный JWT
    token_type:
      type: string
      enum: [Bearer]
    expires_in:
      type: integer
      description: Время жизни токена в секундах (`JWT_TTL`)
      example: 3600